[package]
name = "snowdrop"
version = "0.1.0"
description = "Snowdrop: a community-style chat client for Signal, driven by signal-cli"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
# The app logic lives in the library so integration tests can reach it.
name = "snowdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Only for `tauri:build:bundled`: compiles in the bundled-sidecar fallback in
# the signal-cli resolution order (src/config.rs). The default build has no
# such fallback: it downloads signal-cli into the app data dir instead
# (src/signal_cli_install.rs), so the app itself ships no GPL binary.
bundled-sidecar = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
# External-daemon mode: plain HTTP to a loopback signal-cli daemon (no TLS needed).
ureq = { version = "2", default-features = false }
# First-run signal-cli download: HTTPS to github.com over rustls (no OpenSSL anywhere in the app).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
sha2 = "0.10"
log = "0.4"
# Linux: freedesktop Secret Service over zbus's own self-contained async-io
# executor (pure Rust, no libdbus/OpenSSL, and no ambient Tokio runtime
# needed — secrets.rs calls this from a plain spawned thread). macOS/Windows:
# the native keychain/credential-manager backends.
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust", "apple-native", "windows-native"] }
zeroize = "1"
hkdf = "0.12"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
# Argon2id key derivation for the recovery/passphrase keyslots
# (docs/ENCRYPTION.md, "Key hierarchy"). Only the low-level `hash_password_into`
# API is used, not the PHC-string password-hashing API, so default features
# ("password-hash", "rand") are dropped.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# signal-cli vault (docs/ENCRYPTION.md, "signal-cli vault"): a consistent
# snapshot of account.db while signal-cli still has it open, via SQLite's own
# online backup API. `bundled` compiles SQLite from source so the copy's
# version always matches what this crate links against.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# signal-cli vault: shared OFD `fcntl` locks (`F_OFD_SETLK`/`F_OFD_SETLKW`)
# around copying signal-cli's non-SQLite files — the same lock kind
# `java.nio.channels.FileChannel.lock` takes on Linux, so the two interoperate.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already a transitive dependency of `keyring`'s Secret Service backend;
# depended on directly here too for secrets.rs's own fast availability probe
# (is `org.freedesktop.secrets` owned on the session bus?), run ahead of the
# slow real keyring call (docs/ENCRYPTION.md, "Keyring availability").
zbus = "4"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time", "test-util"] }
# Test-only temp directories that are removed on drop (src/*'s own `temp_dir`
# test helpers, plus tests/vault_e2e.rs's runtime dir), instead of leftovers
# under /tmp/snowdrop-* that `std::env::temp_dir()` alone never cleans up.
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
