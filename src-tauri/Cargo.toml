[package]
name = "snowdrop"
version = "0.1.0"
description = "Snowdrop: a community-style chat client for Signal, driven by signal-cli"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
# The app logic lives in the library so integration tests can reach it.
name = "snowdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Only for `tauri:build:bundled`: compiles in the bundled-sidecar fallback in
# the signal-cli resolution order (src/config.rs). The default build has no
# such fallback: it downloads signal-cli into the app data dir instead
# (src/signal_cli_install.rs), so the app itself ships no GPL binary.
bundled-sidecar = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
# External-daemon mode: plain HTTP to a loopback signal-cli daemon (no TLS needed).
ureq = { version = "2", default-features = false }
# First-run signal-cli download: HTTPS to github.com over rustls (no OpenSSL anywhere in the app).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
sha2 = "0.10"
log = "0.4"
# Linux: freedesktop Secret Service over zbus's own self-contained async-io
# executor (pure Rust, no libdbus/OpenSSL, and no ambient Tokio runtime
# needed — secrets.rs calls this from a plain spawned thread). macOS/Windows:
# the native keychain/credential-manager backends.
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust", "apple-native", "windows-native"] }
zeroize = "1"
hkdf = "0.12"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
